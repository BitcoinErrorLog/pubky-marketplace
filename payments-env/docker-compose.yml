# Composed integration environment: Locks + Paykit Server + Bitcoin regtest.
#
# Extends the upstream Locks compose stack (pinned at ba49a777) with:
#   - a second PostgreSQL for Paykit Server
#   - a Bitcoin Core regtest node
#   - a Fulcrum Electrum-compatible indexer
#   - Paykit Server built from pinned source (see scripts/build-paykit-image.sh)
#   - a paykit-reader helper container for protocol-real payment-request receipt
#
# Every service that needs the Pubky client's fixed local-testnet ports shares
# the pubky-testnet network namespace (network_mode: service:pubky-testnet),
# exactly like the upstream Locks compose. Host ports are configurable in .env.
#
# The service name "postgres" is required by the upstream homeserver config
# (docker/pubky-homeserver.compose.toml points at postgres:5432). Compose
# scopes DNS per project network, so it cannot collide with any container
# named "postgres" in other stacks on this machine.

name: payments-env

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: locks_test
      POSTGRES_USER: locks
      POSTGRES_PASSWORD: locks
    ports:
      - "${LOCKS_POSTGRES_PORT:-55433}:5432"
    volumes:
      - locks-postgres-data:/var/lib/postgresql/data
      - ./sources/locks/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locks -d locks_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  paykit-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: paykit
      POSTGRES_USER: paykit
      POSTGRES_PASSWORD: paykit
    ports:
      - "${PAYKIT_POSTGRES_PORT:-55434}:5432"
    volumes:
      - paykit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paykit -d paykit"]
      interval: 2s
      timeout: 2s
      retries: 30

  bitcoind:
    image: bitcoin/bitcoin:29.1@sha256:de62c536feb629bed65395f63afd02e3a7a777a3ec82fbed773d50336a739319
    command:
      - bitcoind
      - -regtest=1
      - -server=1
      - -txindex=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=paykitregtest
      - -rpcpassword=paykitregtestpass
      - -fallbackfee=0.0001
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=paykitregtest -rpcpassword=paykitregtestpass getblockchaininfo >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  fulcrum:
    image: cculianu/fulcrum:v2.0.0@sha256:cb1c006d0cff104696f4791d0f1516699b2c163120165461385e4de206271943
    depends_on:
      bitcoind:
        condition: service_healthy
    command: ["Fulcrum", "/etc/fulcrum.conf"]
    volumes:
      - fulcrum-data:/data
      - ./overlay/fulcrum.conf:/etc/fulcrum.conf:ro

  pubky-testnet:
    build:
      context: ./sources/locks
      dockerfile: docker/pubky-testnet.Dockerfile
      args:
        PUBKY_CORE_REV: f68014c111af0458e6a321e2d87a12479bfb3218
    ports:
      - "${LOCKS_DHT_PORT:-6881}:6881/udp"
      - "${LOCKS_DHT_PORT:-6881}:6881/tcp"
      - "${LOCKS_PKARR_RELAY_PORT:-15411}:15411"
      - "${LOCKS_HTTP_RELAY_PORT:-15412}:15412"
      - "${LOCKS_HOMESERVER_HTTP_PORT:-6286}:6286"
      - "${LOCKS_HOMESERVER_PUBKY_PORT:-6287}:6287"
      - "${LOCKS_HOMESERVER_ADMIN_PORT:-6288}:6288"
      - "${LOCKS_SERVER_PORT:-3000}:3000"
      - "${PAYKIT_SERVER_PORT:-3001}:3001"
      - "${LOCKS_CREATOR_DEMO_PORT:-8080}:8080"
      - "${LOCKS_READER_DEMO_PORT:-8081}:8081"
    volumes:
      - ./sources/locks/docker/pubky-homeserver.compose.toml:/etc/pubky-homeserver/config.toml:ro
    command: ["pubky-testnet", "--homeserver-config", "/etc/pubky-homeserver/config.toml"]

  locks-server:
    build:
      context: ./sources/locks
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pubky-testnet:
        condition: service_started
    network_mode: service:pubky-testnet
    environment:
      PUBKY_LOCK_DATABASE_URL: postgres://locks:locks@postgres:5432/locks_test
      PUBKY_LOCK_CREATOR_AUTH_ENCRYPTION_KEY: ${PUBKY_LOCK_CREATOR_AUTH_ENCRYPTION_KEY:-}
      LOCKS_PAYKIT_SERVER_URL: ${LOCKS_PAYKIT_SERVER_URL:-http://127.0.0.1:3001}
      LOCKS_PAYKIT_MIN_CONFIRMATIONS: ${LOCKS_PAYKIT_MIN_CONFIRMATIONS:-1}
    volumes:
      - lock-home:/var/lib/pubky-lock
      - paykit-shared:/paykit-shared
      - ./overlay/locks-server-entrypoint-paykit.sh:/usr/local/bin/locks-server-entrypoint-paykit.sh:ro
    command: ["sh", "/usr/local/bin/locks-server-entrypoint-paykit.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/readyz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60

  paykit-server:
    image: paykit-server:local-867fc883
    depends_on:
      paykit-postgres:
        condition: service_healthy
      fulcrum:
        condition: service_started
      locks-server:
        condition: service_healthy
      pubky-testnet:
        condition: service_started
    network_mode: service:pubky-testnet
    environment:
      PAYKIT_CONFIG: /paykit-shared/paykit-server.toml
      PAYKIT_DATABASE_URL: postgres://paykit:paykit@paykit-postgres:5432/paykit
      PAYKIT_MASTER_KEY: ${PAYKIT_MASTER_KEY:?generate .env with scripts/up.sh}
    volumes:
      - paykit-shared:/paykit-shared:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -s /paykit-shared/paykit-server.toml ]; do
          echo '[paykit-compose] waiting for generated Paykit Server config'
          sleep 1
        done
        exec /usr/local/bin/paykit-server

  # Helper container for the protocol-real reader (Bitkit's protocol role).
  # paykit-reader-demo signs the reader in on the local testnet, publishes a
  # Paykit receiver marker, links with the Creator peer, and receives the
  # private Payment Request that carries the invoice address.
  paykit-reader:
    image: paykit-server:local-867fc883
    depends_on:
      paykit-server:
        condition: service_started
    network_mode: service:pubky-testnet
    user: "0"
    environment:
      PAYKIT_READER_STATE_PATH: /reader-state/state.bin
      PAYKIT_READER_PUBKY_TESTNET_HOST: localhost
      PAYKIT_READER_RECEIVER_PATH: bitkit/server
      PAYKIT_READER_SERVER_PATH: bitkit/server
    volumes:
      - reader-state:/reader-state
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]

  creator-demo:
    image: node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    working_dir: /workspace
    depends_on:
      locks-server:
        condition: service_healthy
      pubky-testnet:
        condition: service_started
    network_mode: service:pubky-testnet
    environment:
      LOCKS_INTERNAL_LOCK_SERVER_URL: http://127.0.0.1:3000
      LOCKS_INTERNAL_HTTP_RELAY: http://localhost:15412
      LOCKS_INTERNAL_PKARR_RELAY: http://localhost:15411
      LOCKS_INTERNAL_DHT_BOOTSTRAP: 127.0.0.1:6881
    volumes:
      - ./sources/locks:/workspace
      - ./overlay/js:/overlay-js:ro
      - lock-home:/root
      - js-demo-node-modules:/workspace/examples/js-sdk/node_modules
    command:
      - sh
      - -lc
      - |
        set -eu
        until [ -f /root/.pubky-lock/config.toml ]; do echo '[creator-demo] waiting for lock-server config'; sleep 1; done
        npm --prefix examples/js-sdk install
        npm --prefix examples/js-sdk run init-config
        npm --prefix examples/js-sdk run create-user -- --role content-creator
        npm --prefix examples/js-sdk run start-server -- --allow-unhealthy

  reader-demo:
    image: node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    working_dir: /workspace
    depends_on:
      locks-server:
        condition: service_healthy
      pubky-testnet:
        condition: service_started
    network_mode: service:pubky-testnet
    environment:
      LOCKS_INTERNAL_LOCK_SERVER_URL: http://127.0.0.1:3000
      LOCKS_INTERNAL_HTTP_RELAY: http://localhost:15412
      LOCKS_INTERNAL_PKARR_RELAY: http://localhost:15411
      LOCKS_INTERNAL_DHT_BOOTSTRAP: 127.0.0.1:6881
    volumes:
      - ./sources/locks:/workspace
      - lock-home:/root
      - js-demo-node-modules:/workspace/examples/js-sdk/node_modules
    command:
      - sh
      - -lc
      - |
        set -eu
        until [ -f /root/.pubky-lock/config.toml ]; do echo '[reader-demo] waiting for lock-server config'; sleep 1; done
        npm --prefix examples/js-sdk install
        npm --prefix examples/js-sdk run init-config
        npm --prefix examples/js-sdk run start-reader-server -- --allow-unhealthy

volumes:
  locks-postgres-data:
  paykit-postgres-data:
  bitcoind-data:
  fulcrum-data:
  lock-home:
  paykit-shared:
  reader-state:
  js-demo-node-modules:
