name: Tests

on:
  merge_group:
  push:
    branches:
      - 'release/**'
      - main
      - master
  pull_request:
    branches:
      - '**' # Run on PRs targeting any branch
  # Enable manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Docs-only changes skip the unit suite through the `paths` job.
# Every changed file under docs/, payments-env/ or ending in .md is docs.
# The shard jobs still start and skip their steps: a matrix job skipped by
# `if` never reports the per-shard names, so the required checks
# `Run Shard Tests (1)` to `(5)` would stay Pending.
# A failed or cancelled path filter must not skip the suite: the shards
# run and exit 1. merge_group, workflow_dispatch and a push without a
# usable `before` always test.
jobs:
  paths:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match non-docs paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "test paths match: true (no comparable base for ${EVENT_NAME})"
            exit 0
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          run=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              docs/*|payments-env/*|*.md) ;;
              *)
                run=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "test paths match: $run"

  test:
    name: Run Shard Tests
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUN_TESTS: ${{ needs.paths.outputs.run }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Fail closed when the path filter did not succeed
        if: needs.paths.result != 'success'
        run: |
          echo "Path filter result is ${{ needs.paths.result }}. Run Shard Tests fails closed."
          exit 1

      - name: Docs-only change
        if: env.RUN_TESTS != 'true'
        run: echo "Only docs changed; the unit suite does not run."

      - name: Checkout code
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.RUN_TESTS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun
        if: env.RUN_TESTS == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        run: bun install

      - name: Run Vitest Shard ${{ matrix.shard }}
        if: env.RUN_TESTS == 'true'
        env:
          VITEST_MAX_WORKERS: 4
        # 1. Force Vitest to output raw 'json' coverage data
        run: npx vitest run --project unit --coverage --coverage.reporter=json --shard=${{ matrix.shard }}/5 --pool=forks

      - name: Rename coverage file
        if: always() && env.RUN_TESTS == 'true'
        # 2. Rename the file so the shards don't overwrite each other when downloaded
        run: mv coverage/coverage-final.json coverage/coverage-${{ matrix.shard }}.json

      - name: Upload partial coverage
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/coverage-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1 # We only need this temporarily for the merge job

  merge-coverage:
    name: Merge Coverage Reports
    needs: [paths, test] # 3. Wait for all test shards to complete
    runs-on: ubuntu-latest
    timeout-minutes: 6
    if: always() && needs.paths.outputs.run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: .nyc_output # 4. Download directly into nyc's default input folder
          merge-multiple: true

      - name: Merge coverage and generate final report
        # 5. Read the .nyc_output folder and generate standard unified reports
        run: npx nyc report --reporter=lcov --reporter=html --reporter=text-summary

      - name: Upload Final Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-final
          path: coverage/ # Contains your unified lcov.info and html reports
          retention-days: 30

  test-status:
    name: Run Tests
    needs: test     # Waits for all your test shards to finish
    if: always()    # Forces this to run even if a shard fails
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check test matrix status
        # If any shard failed or was cancelled, this step fails the gatekeeper job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more test shards failed."
          exit 1

      - name: Tests passed
        run: echo "All test shards passed successfully!"
